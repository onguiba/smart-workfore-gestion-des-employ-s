<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SmartWorkforce AI — Nouvelle Demande de Congé</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#EEF2FF',
                100: '#E0E7FF',
                500: '#6366F1',
                600: '#4F46E5',
                700: '#4338CA',
                900: '#1E1B4B'
              }
            }
          }
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="professional-styles.css"/>
    <script src="localdb.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 pb-20">

    <!-- Top Navigation Header -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 px-4 md:px-8 py-3.5 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-4">
            <a href="leaves.html" class="flex items-center gap-2 group text-slate-800 hover:text-purple-600 transition">
                <span class="material-symbols-outlined text-xl text-slate-400 group-hover:text-purple-600">arrow_back</span>
                <span class="font-bold text-sm">Retour aux Congés</span>
            </a>
            <div class="h-5 w-px bg-slate-200 hidden sm:block"></div>
            <h1 class="font-extrabold text-base text-slate-900 hidden sm:block">Formulaire de Demande d'Absence</h1>
        </div>

        <div class="flex items-center gap-2.5">
            <img class="w-8 h-8 rounded-full object-cover ring-2 ring-purple-500/20" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Moussa Diop"/>
            <span class="text-xs font-bold text-slate-800 hidden sm:inline">Moussa Diop</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-2xl mx-auto px-4 py-10 space-y-8">
        
        <div class="text-center">
            <span class="text-xs font-bold text-purple-600 uppercase tracking-wider bg-purple-50 border border-purple-200 px-3 py-1 rounded-full">
                Formulaire Certifié
            </span>
            <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 mt-3 tracking-tight">Déposer une Demande de Congé</h2>
            <p class="text-xs md:text-sm text-slate-500 mt-1 max-w-md mx-auto">
                Votre solde de congés payés restants est actuellement de <strong>22 jours</strong>.
            </p>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-2xl border border-slate-200 p-6 md:p-8 shadow-sm">
            <form id="standaloneLeaveForm" onsubmit="submitStandaloneLeave(event)" class="space-y-6 text-xs">
                
                <!-- Type Selection Radio Tiles -->
                <div>
                    <label class="block font-bold text-slate-900 mb-2.5 text-xs uppercase tracking-wider">Type de Congé</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <label class="cursor-pointer border-2 border-purple-500 bg-purple-50/50 p-4 rounded-xl flex flex-col items-center text-center transition hover:border-purple-600">
                            <input type="radio" name="leaveType" value="Congés Payés" checked class="hidden"/>
                            <span class="material-symbols-outlined text-purple-600 text-2xl mb-1">palm_tree</span>
                            <span class="font-bold text-slate-900 text-xs">Congés Payés</span>
                            <span class="text-[10px] text-slate-500 mt-0.5">22 jours dispo</span>
                        </label>

                        <label class="cursor-pointer border-2 border-slate-200 bg-slate-50/50 p-4 rounded-xl flex flex-col items-center text-center transition hover:border-purple-500">
                            <input type="radio" name="leaveType" value="RTT" class="hidden"/>
                            <span class="material-symbols-outlined text-indigo-600 text-2xl mb-1">schedule</span>
                            <span class="font-bold text-slate-900 text-xs">RTT 2026</span>
                            <span class="text-[10px] text-slate-500 mt-0.5">9 jours dispo</span>
                        </label>

                        <label class="cursor-pointer border-2 border-slate-200 bg-slate-50/50 p-4 rounded-xl flex flex-col items-center text-center transition hover:border-purple-500">
                            <input type="radio" name="leaveType" value="Congé Maladie" class="hidden"/>
                            <span class="material-symbols-outlined text-rose-600 text-2xl mb-1">healing</span>
                            <span class="font-bold text-slate-900 text-xs">Maladie</span>
                            <span class="text-[10px] text-slate-500 mt-0.5">Certificat requis</span>
                        </label>
                    </div>
                </div>

                <!-- Date Range Selection -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Date de début</label>
                        <input id="saStartDate" type="date" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-purple-500 font-medium" onchange="calculateSaDuration()"/>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Date de fin</label>
                        <input id="saEndDate" type="date" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-purple-500 font-medium" onchange="calculateSaDuration()"/>
                    </div>
                </div>

                <!-- Calculated Days Pill -->
                <div class="bg-purple-50 p-3.5 rounded-xl border border-purple-200 flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-purple-900">Durée calculée :</span>
                        <p class="text-[11px] text-purple-700">Déduction prévisionnelle sur votre solde CP</p>
                    </div>
                    <span id="saDurationBadge" class="font-extrabold text-sm text-purple-700 bg-white px-3 py-1 rounded-lg border border-purple-200 shadow-sm">1 jour</span>
                </div>

                <!-- Reason Textarea -->
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Motif ou Précisions (Optionnel)</label>
                    <textarea id="saReason" rows="3" placeholder="Indiquez toute précision utile pour la validation RH..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-purple-500"></textarea>
                </div>

                <!-- Submission Button -->
                <div class="pt-2">
                    <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-sm shadow-lg shadow-purple-500/25 transition transform active:scale-95 flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-lg">send</span>
                        <span>Soumettre la Demande de Congé</span>
                    </button>
                </div>

            </form>
        </div>

    </main>

    <!-- Toast Notification Container -->
    <div id="saToastContainer"></div>

    <script>
      function showSaToast(msg, type = 'success') {
        const c = document.getElementById('saToastContainer');
        const t = document.createElement('div');
        t.className = `toast-notification ${type === 'success' ? 'toast-success' : 'toast-info'}`;
        t.innerHTML = `<span class="material-symbols-outlined">${type === 'success' ? 'check_circle' : 'info'}</span><span>${msg}</span>`;
        c.appendChild(t);
        setTimeout(() => t.remove(), 4000);
      }

      function calculateSaDuration() {
        const s = document.getElementById('saStartDate')?.value;
        const e = document.getElementById('saEndDate')?.value;
        const badge = document.getElementById('saDurationBadge');
        if (s && e && badge) {
          const start = new Date(s);
          const end = new Date(e);
          const diffDays = Math.max(1, Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24)) + 1);
          badge.textContent = `${diffDays} jour${diffDays > 1 ? 's' : ''}`;
        }
      }

      // Default dates
      document.addEventListener('DOMContentLoaded', () => {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const nextWeek = new Date();
        nextWeek.setDate(nextWeek.getDate() + 5);

        document.getElementById('saStartDate').value = tomorrow.toISOString().split('T')[0];
        document.getElementById('saEndDate').value = nextWeek.toISOString().split('T')[0];
        calculateSaDuration();

        // Radio click visual feedback
        document.querySelectorAll('input[name="leaveType"]').forEach(r => {
          r.addEventListener('change', function() {
            document.querySelectorAll('input[name="leaveType"]').forEach(radio => {
              const label = radio.closest('label');
              if (radio.checked) {
                label.className = 'cursor-pointer border-2 border-purple-500 bg-purple-50/50 p-4 rounded-xl flex flex-col items-center text-center transition hover:border-purple-600';
              } else {
                label.className = 'cursor-pointer border-2 border-slate-200 bg-slate-50/50 p-4 rounded-xl flex flex-col items-center text-center transition hover:border-purple-500';
              }
            });
          });
        });
      });

      async function submitStandaloneLeave(e) {
        e.preventDefault();
        const type = document.querySelector('input[name="leaveType"]:checked')?.value || 'Congés Payés';
        const startDate = document.getElementById('saStartDate').value;
        const endDate = document.getElementById('saEndDate').value;
        const reason = document.getElementById('saReason').value || 'Demande de congés';

        const s = new Date(startDate);
        const ed = new Date(endDate);
        const diffDays = Math.max(1, Math.ceil(Math.abs(ed - s) / (1000 * 60 * 60 * 24)) + 1);

        try {
          await fetch('/api/leaves/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type,
              startDate,
              endDate,
              days: diffDays,
              reason
            })
          });
        } catch(err) {}

        showSaToast('✓ Demande enregistrée avec succès ! Redirection...', 'success');
        setTimeout(() => {
          window.location.href = 'leaves.html';
        }, 1200);
      }
    </script>
    <script src="auth.js"></script>
</body>
</html>
