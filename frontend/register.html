<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Employé - Smart Workforce AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .camera-section {
            margin: 30px 0;
            text-align: center;
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin: 15px 0;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        #video {
            width: 100%;
            display: block;
        }

        #canvas {
            display: none;
        }

        .captured-photo {
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
        }

        .camera-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 16px;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .info-box h3 {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .location-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #e7f3ff;
            border-radius: 8px;
            margin-top: 10px;
        }

        .location-info svg {
            width: 20px;
            height: 20px;
            color: #667eea;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .required {
            color: red;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-badge.active {
            background: #d4edda;
            color: #155724;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Inscription</h1>
            <p>Photo + GPS + Informations</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Nom complet <span class="required">*</span></label>
                <input type="text" id="fullName" required placeholder="Ex: Jean Dupont">
            </div>

            <div class="form-group">
                <label>Email professionnel <span class="required">*</span></label>
                <input type="email" id="email" required placeholder="jean.dupont@entreprise.com">
            </div>

            <div class="form-group">
                <label>Téléphone <span class="required">*</span></label>
                <input type="tel" id="phone" required placeholder="+33 6 12 34 56 78">
            </div>

            <div class="form-group">
                <label>Poste / Fonction <span class="required">*</span></label>
                <input type="text" id="position" required placeholder="Ex: Développeur Full-Stack">
            </div>

            <div class="form-group">
                <label>Département <span class="required">*</span></label>
                <select id="department" required>
                    <option value="">-- Sélectionner --</option>
                    <option value="IT">Informatique (IT)</option>
                    <option value="HR">Ressources Humaines (RH)</option>
                    <option value="Operations">Opérations</option>
                    <option value="Logistics">Logistique</option>
                    <option value="Sales">Ventes</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Finance">Finance</option>
                    <option value="Support">Support Client</option>
                </select>
            </div>

            <div class="form-group">
                <label>Salaire mensuel (€) <span class="required">*</span></label>
                <input type="number" id="salary" required placeholder="3500" min="1000" step="100">
            </div>

            <div class="camera-section">
                <h3>Photo d'identification</h3>

                <div class="camera-container">
                    <video id="video" autoplay></video>
                    <canvas id="canvas"></canvas>
                </div>

                <div id="photoPreview"></div>

                <div class="camera-controls">
                    <button type="button" class="btn btn-primary" id="startCamera">
                        📷 Activer la caméra
                    </button>
                    <button type="button" class="btn btn-secondary" id="capturePhoto" disabled>
                        📸 Prendre la photo
                    </button>
                    <button type="button" class="btn btn-secondary" id="retakePhoto" style="display: none;">
                        🔄 Reprendre
                    </button>
                </div>
            </div>

            <div class="info-box">
                <h3>Localisation GPS</h3>
                <p>Position enregistrée automatiquement</p>
                <div id="locationInfo" class="location-info" style="display: none;">
                    <svg fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                    </svg>
                    <div>
                        <strong>Position détectée</strong><br>
                        <span id="locationText">Chargement...</span>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #666;">Enregistrement en cours...</p>
            </div>

            <button type="submit" class="btn btn-success" id="submitBtn" disabled>
                Finaliser l'inscription
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/home.html" style="color: #667eea; text-decoration: none; font-size: 14px;">
                ← Retour
            </a>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
