<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointage - Smart Workforce AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .current-time {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin: 20px 0;
        }

        .current-date {
            font-size: 18px;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }

        .status-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
        }

        .status-card h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .status-card p {
            font-size: 16px;
            opacity: 0.9;
        }

        .camera-section {
            margin: 30px 0;
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px 0;
        }

        #video {
            width: 100%;
            display: block;
        }

        #canvas {
            display: none;
        }

        .photo-preview {
            text-align: center;
            margin: 20px 0;
        }

        .photo-preview img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-checkin {
            background: #28a745;
            color: white;
        }

        .btn-checkin:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .btn-checkout {
            background: #dc3545;
            color: white;
        }

        .btn-checkout:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }

        .btn-camera {
            background: #667eea;
            color: white;
        }

        .btn-camera:hover {
            background: #5568d3;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .info-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
            font-weight: 500;
        }

        .location-box {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .location-box svg {
            width: 24px;
            height: 24px;
            color: #667eea;
            flex-shrink: 0;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .history-section {
            margin-top: 40px;
        }

        .history-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .history-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item-date {
            font-weight: 600;
            color: #333;
        }

        .history-item-time {
            color: #666;
            font-size: 14px;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-in {
            background: #d4edda;
            color: #155724;
        }

        .badge-out {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script src="localdb.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Pointage</h1>
        </div>

        <div id="alert" class="alert"></div>

        <div class="current-time" id="currentTime">--:--:--</div>
        <div class="current-date" id="currentDate">--</div>

        <div class="status-card" id="statusCard">
            <h2 id="statusTitle">Prêt à pointer</h2>
            <p id="statusMessage">Utilisez la caméra pour vous identifier</p>
        </div>

        <div class="camera-section">
            <h3 style="text-align: center; margin-bottom: 15px; color: #333;">Identification</h3>
            
            <div class="camera-container" id="cameraContainer">
                <video id="video" autoplay></video>
                <canvas id="canvas"></canvas>
            </div>

            <div id="photoPreview" class="photo-preview"></div>

            <div class="action-buttons">
                <button class="btn btn-camera" id="startCamera">
                    📷 Activer la caméra
                </button>
                <button class="btn btn-camera" id="capturePhoto" disabled>
                    📸 Capturer
                </button>
            </div>
        </div>

        <div class="location-box" id="locationBox" style="display: none;">
            <svg fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
            </svg>
            <div>
                <strong>Position GPS détectée</strong><br>
                <span id="locationText">Chargement...</span>
            </div>
        </div>

        <div class="info-box" id="currentInfo" style="display: none;">
            <div class="info-row">
                <span class="info-label">Nom:</span>
                <span class="info-value" id="employeeName">--</span>
            </div>
            <div class="info-row">
                <span class="info-label">Heure d'arrivée:</span>
                <span class="info-value" id="checkInTime">--</span>
            </div>
            <div class="info-row">
                <span class="info-label">Localisation:</span>
                <span class="info-value" id="checkInLocation">--</span>
            </div>
        </div>

        <div class="action-buttons" id="actionButtons" style="display: none;">
            <button class="btn btn-checkin" id="checkInBtn">
                Arrivée
            </button>
            <button class="btn btn-checkout" id="checkOutBtn">
                Départ
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Enregistrement...</p>
        </div>

        <div class="history-section" id="historySection" style="display: none;">
            <h3>Historique du jour</h3>
            <div id="historyList"></div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="/home.html" style="color: #667eea; text-decoration: none; font-size: 16px;">
                ← Retour
            </a>
        </div>
    </div>

    <script src="attendance.js"></script>
</body>
</html>
