<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compte - Smart Workforce</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
        }

        .profile-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
        }

        .profile-info h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .profile-info p {
            opacity: 0.9;
            font-size: 14px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
            display: block;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        button.action-btn {
            width: 100%;
        }

        .action-btn.logout-style {
            background: rgba(255, 255, 255, 0.15);
        }

        .action-btn.logout-style:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-icon {
            font-size: 24px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;
            font-size: 14px;
        }

        .info-value {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-green {
            background: #d4edda;
            color: #28a745;
        }

        .badge-blue {
            background: #d1ecf1;
            color: #0d6efd;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
            transition: all 0.3s;
            margin-top: 16px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .logout-btn {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        .logout-btn:hover {
            background: rgba(220, 53, 69, 0.2);
        }

        @media (max-width: 768px) {
            .profile-section {
                flex-direction: column;
                text-align: center;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="profile-section">
            <img id="profilePhoto" src="" alt="Photo" class="profile-photo" style="display:none;">
            <div id="profilePhotoPlaceholder" style="width: 80px; height: 80px; border-radius: 50%; background: white; color: #667eea; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; border: 4px solid white;">?</div>
            <div class="profile-info">
                <h1 id="employeeName">Chargement...</h1>
                <p id="employeeRole">-</p>
                <p id="employeeMatricule">-</p>
            </div>
        </div>
        <div class="quick-actions">
            <a href="/attendance.html" class="action-btn">⏰ Pointer</a>
            <a href="/dashboard.html" class="action-btn">📊 Tableau de bord</a>
            <button class="action-btn logout-style" onclick="logout()">🚪 Déconnexion</button>
        </div>
    </div>

    <div class="content-grid">
        <!-- Informations personnelles -->
        <div class="card">
            <div class="card-title">
                <span class="card-icon">👤</span>
                Informations
            </div>
            <div class="info-row">
                <span class="info-label">Email</span>
                <span class="info-value" id="infoEmail">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Téléphone</span>
                <span class="info-value" id="infoPhone">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Département</span>
                <span class="info-value" id="infoDepartment">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Date d'inscription</span>
                <span class="info-value" id="infoJoinDate">-</span>
            </div>
        </div>

        <!-- Pointage du jour -->
        <div class="card">
            <div class="card-title">
                <span class="card-icon">⏰</span>
                Pointage du jour
            </div>
            <div id="todayAttendance">
                <div class="info-row">
                    <span class="info-label">Statut</span>
                    <span class="info-value" id="statusBadge">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Arrivée</span>
                    <span class="info-value" id="checkInTime">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Départ</span>
                    <span class="info-value" id="checkOutTime">-</span>
                </div>
            </div>
            <a href="/attendance.html" class="btn btn-primary">Pointer maintenant</a>
        </div>

        <!-- Statistiques -->
        <div class="card">
            <div class="card-title">
                <span class="card-icon">📊</span>
                Mes statistiques
            </div>
            <div class="info-row">
                <span class="info-label">Jours travaillés</span>
                <span class="info-value" id="statWorkedDays">0</span>
            </div>
            <div class="info-row">
                <span class="info-label">Taux de présence</span>
                <span class="info-value" id="statAttendanceRate">100%</span>
            </div>
            <div class="info-row">
                <span class="info-label">Congés restants</span>
                <span class="info-value" id="statLeaveDays">30 jours</span>
            </div>
        </div>
    </div>

    <script>
        // Vérifier si l'utilisateur est connecté
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        
        if (!currentUser) {
            // Rediriger vers l'accueil si pas connecté
            window.location.href = '/home.html';
        } else {
            // Afficher les informations
            displayUserInfo(currentUser);
        }

        function displayUserInfo(user) {
            // Photo
            if (user.photo) {
                document.getElementById('profilePhoto').src = user.photo;
                document.getElementById('profilePhoto').style.display = 'block';
                document.getElementById('profilePhotoPlaceholder').style.display = 'none';
            } else {
                const initial = user.name.charAt(0).toUpperCase();
                document.getElementById('profilePhotoPlaceholder').textContent = initial;
            }

            // Informations générales
            document.getElementById('employeeName').textContent = user.name;
            document.getElementById('employeeRole').textContent = user.position || user.role;
            document.getElementById('employeeMatricule').textContent = 'Matricule: ' + (user.matricule || '-');

            // Détails
            document.getElementById('infoEmail').textContent = user.email;
            document.getElementById('infoPhone').textContent = user.phone || '-';
            document.getElementById('infoDepartment').textContent = user.department;
            document.getElementById('infoJoinDate').textContent = user.joinDate || user.registrationDate || '-';

            // Statut
            const status = user.status === 'present' ? 'Présent' : 'Absent';
            const statusClass = user.status === 'present' ? 'badge-green' : 'badge-blue';
            document.getElementById('statusBadge').innerHTML = `<span class="badge ${statusClass}">${status}</span>`;

            // Heures
            document.getElementById('checkInTime').textContent = user.checkInTime || user.registrationTime || 'Non pointé';
            document.getElementById('checkOutTime').textContent = user.checkOutTime || 'Non pointé';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/home.html';
        }
    </script>
</body>
</html>
