version: '3.8'

# Configuration Docker Compose pour Production Cloud
# Optimisé pour AWS ECS, Azure Container Instances, Google Cloud Run

services:
  app:
    image: ${DOCKER_REGISTRY:-smartworkforce}/app:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: smart-workforce-app-prod
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      
      # Base de données - Utiliser les variables d'environnement
      DB_DRIVER: ${DB_DRIVER:-postgresql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-smart_workforce}
      DB_USER: ${DB_USER:-smartworkforce}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Sécurité
      JWT_SECRET: ${JWT_SECRET}
      
      # Monitoring (optionnel)
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      
    networks:
      - smart-workforce-prod
    
    # Health check pour orchestrateurs cloud
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Limites de ressources
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
      
      # Auto-scaling avec Docker Swarm
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    
    # Logs structurés
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=app,env=production"

  # PostgreSQL - Remplacer par RDS/Cloud SQL en production
  postgres:
    image: postgres:15-alpine
    container_name: smart-workforce-postgres-prod
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-smart_workforce}
      POSTGRES_USER: ${DB_USER:-smartworkforce}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart-workforce-prod
    
    # Optimisations PostgreSQL
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smartworkforce}"]
      timeout: 20s
      retries: 10
      interval: 30s
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: smart-workforce-nginx-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - smart-workforce-prod
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis pour cache et sessions (optionnel mais recommandé)
  redis:
    image: redis:7-alpine
    container_name: smart-workforce-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-workforce-prod
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_prod_data:
    driver: local
  redis_data:
    driver: local

networks:
  smart-workforce-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
