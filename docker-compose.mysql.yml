version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smart-workforce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_changeme
      MYSQL_DATABASE: smart_workforce
      MYSQL_USER: smartworkforce
      MYSQL_PASSWORD: smartworkforce2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/hostinger_database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart-workforce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword_changeme"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-workforce-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smart_workforce
      DB_USER: smartworkforce
      DB_PASSWORD: smartworkforce2026
      JWT_SECRET: swa_enterprise_biometric_token_2026_mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smart-workforce-network
    volumes:
      - ./backend/data:/app/backend/data

  nginx:
    image: nginx:alpine
    container_name: smart-workforce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - smart-workforce-network

volumes:
  mysql_data:
    driver: local

networks:
  smart-workforce-network:
    driver: bridge
