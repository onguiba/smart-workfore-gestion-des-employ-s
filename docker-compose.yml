# ============================================================
# TSA SmartWorkforce AI™ — Docker Compose (Multi-Container)
# Orchestration : App Node.js + MySQL 8 + Nginx Reverse Proxy
# ============================================================

version: "3.9"

# ─── Shared Network ─────────────────────────────────────────
networks:
  tsa-network:
    driver: bridge

# ─── Persistent Volumes ─────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  app_data:
    driver: local

# ─── Services ───────────────────────────────────────────────
services:

  # ──────────────────────────────────────────────────────────
  # 1. MySQL 8 Database
  # ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: tsa_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootTSA2026!}
      MYSQL_DATABASE: ${DB_NAME:-smartworkforce}
      MYSQL_USER: ${DB_USER:-tsa_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-WorkforceTSA2026!}
    volumes:
      # Persist database between restarts
      - mysql_data:/var/lib/mysql
      # Auto-import schema on first boot
      - ./hostinger_database.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      # Only expose on localhost for security (not public)
      - "127.0.0.1:3306:3306"
    networks:
      - tsa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootTSA2026!}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --max-connections=100

  # ──────────────────────────────────────────────────────────
  # 2. Node.js Application (TSA SmartWorkforce)
  # ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: tsa-smartworkforce:latest
    container_name: tsa_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # MySQL connection (points to the 'db' service)
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smartworkforce}
      DB_USER: ${DB_USER:-tsa_admin}
      DB_PASSWORD: ${DB_PASSWORD:-WorkforceTSA2026!}
      JWT_SECRET: ${JWT_SECRET:-swa_enterprise_biometric_2026_key}
    volumes:
      # Persistent JSON data fallback
      - app_data:/app/data
    ports:
      # Internal only — Nginx will handle public access
      - "127.0.0.1:3000:3000"
    networks:
      - tsa-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/employees"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ──────────────────────────────────────────────────────────
  # 3. Nginx — Reverse Proxy + SSL Termination + Gzip
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: tsa_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL certificates (Let's Encrypt via Certbot)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Certbot webroot challenge folder
      - ./nginx/certbot/www:/var/www/certbot:ro
    networks:
      - tsa-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
