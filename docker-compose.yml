version: '3.8'

services:
  # Service PostgreSQL pour la base de données
  postgres:
    image: postgres:15-alpine
    container_name: smart-workforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpassword}
      POSTGRES_DB: ${DB_NAME:-smart_workforce}
      POSTGRES_USER: ${DB_USER:-smartworkforce}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart-workforce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartworkforce"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Service Application Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-workforce-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_DRIVER: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_workforce}
      DB_USER: ${DB_USER:-smartworkforce}
      DB_PASSWORD: ${DB_PASSWORD:-smartworkforce2026}
      JWT_SECRET: ${JWT_SECRET:-swa_enterprise_biometric_token_2026_docker_secure_key}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smart-workforce-network
    volumes:
      - ./backend/data:/app/backend/data
      - ./frontend:/app/frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service Nginx (optionnel - pour production)
  nginx:
    image: nginx:alpine
    container_name: smart-workforce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - smart-workforce-network

volumes:
  postgres_data:
    driver: local

networks:
  smart-workforce-network:
    driver: bridge
