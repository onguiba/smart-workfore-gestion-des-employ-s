version: '3.8'

# Configuration Docker Compose pour le développement
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart-workforce-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpassword}
      POSTGRES_DB: ${DB_NAME:-smart_workforce_dev}
      POSTGRES_USER: ${DB_USER:-smartworkforce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart-workforce-dev

  # Application Node.js en mode développement avec hot-reload
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smart-workforce-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_DRIVER: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_workforce_dev}
      DB_USER: ${DB_USER:-smartworkforce}
      DB_PASSWORD: ${DB_PASSWORD:-smartworkforce2026}
      JWT_SECRET: ${JWT_SECRET:-swa_dev_token_key}
    depends_on:
      - postgres
    networks:
      - smart-workforce-dev
    volumes:
      # Mount source code for hot-reload
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - /app/backend/node_modules
    command: npm run dev

volumes:
  postgres_dev_data:

networks:
  smart-workforce-dev:
    driver: bridge
