# ============================================================
# Docker Compose pour développement LOCAL uniquement
# Lance l'app sans Nginx (accès direct port 3000)
# Usage : docker compose -f docker-compose.dev.yml up
# ============================================================

version: "3.9"

networks:
  tsa-dev:
    driver: bridge

volumes:
  mysql_dev_data:

services:

  db:
    image: mysql:8.0
    container_name: tsa_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: smartworkforce_dev
      MYSQL_USER: tsa_dev
      MYSQL_PASSWORD: devpassword
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./hostinger_database.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      # Accessible depuis le host pour phpMyAdmin local ou DBeaver
      - "3306:3306"
    networks:
      - tsa-dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: tsa_app_dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: smartworkforce_dev
      DB_USER: tsa_dev
      DB_PASSWORD: devpassword
    volumes:
      # Live-reload du code en dev (montage du dossier)
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
    ports:
      # Accès direct à l'app en dev
      - "3000:3000"
    networks:
      - tsa-dev
